# Packaging with electron-builder. Nothing here publishes anything: `publish: null`.
# Windows is the main target; the macOS and Linux entries are there for later and are not tested.
electronVersion: 44.5.1
appId: io.github.dawei7.mathcanvasprep
productName: Math Canvas Prep
copyright: Math Canvas Prep contributors
directories:
  output: release
files:
  - out/**/*
  - package.json
  - "!out/**/*.map"
asar: true
asarUnpack:
  - "node_modules/@napi-rs/**/*"
extraMetadata:
  main: out/main.cjs
publish: null
win:
  target:
    - target: dir
    - target: nsis
  # Signing needs a certificate that this repository does not have; the build says so and stays unsigned.
  signAndEditExecutable: false
  forceCodeSigning: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.education
linux:
  target: AppImage
  category: Education
